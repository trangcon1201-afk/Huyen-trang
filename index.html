<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <title>Bimbosan Megalive | AR</title>
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
  <style>
    * { box-sizing: border-box; }
    html, body { margin:0; width:100%; height:100%; overflow:hidden; background:transparent; font-family:Arial,sans-serif; }
    #top { position:fixed; z-index:30; top:14px; left:50%; transform:translateX(-50%); background:#fffdf2; color:#9f1d20; border-radius:30px; padding:9px 18px; font-weight:bold; white-space:nowrap; }
    #status { position:fixed; z-index:30; bottom:22px; left:50%; transform:translateX(-50%); background:rgba(16,35,45,.85); color:white; border-radius:16px; padding:11px 17px; text-align:center; font-size:13px; width:min(94vw,420px); pointer-events:none; }
    #err { position:fixed; z-index:35; top:64px; left:5%; width:90%; color:#8a1111; background:#fff3ed; padding:10px; border-radius:12px; display:none; font-size:12px; }
  </style>
</head>
<body>
  <div id="top">Bimbosan · Megalive AR</div>
  <div id="status">Đang khởi động camera…</div>
  <div id="err"></div>
  <a-scene
    mindar-image="imageTargetSrc: ./targets.mind; maxTrack: 1; filterMinCF: 0.0001; filterBeta: 0.01;"
    embedded
    renderer="colorManagement: true; alpha: true; antialias: true"
    background="color: transparent"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false"
    loading-screen="enabled: false">
    <a-assets timeout="25000">
      <img id="frameAsset" src="./megalive_frame.png" crossorigin="anonymous">
      <img id="tableAsset" src="./bimbosan_table.png" crossorigin="anonymous">
    </a-assets>
    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
    <a-entity id="target" mindar-image-target="targetIndex: 0">
      <!-- Hiển thị cố định trước để kiểm tra, chưa dùng animation. -->
      <a-image id="frame" src="#frameAsset" width="1" height="1.773" position="0 0 0.025"
        material="shader: flat; transparent: true; alphaTest: 0.01; depthWrite: false; side: double" visible="true"></a-image>
      <a-entity id="product" position="0 -0.16 0.14" visible="true">
        <a-image src="#tableAsset" width="0.81" height="0.944"
          material="shader: flat; transparent: true; alphaTest: 0.01; depthWrite: false; side: double"></a-image>
      </a-entity>
    </a-entity>
  </a-scene>
  <script>
    const target = document.getElementById('target');
    const status = document.getElementById('status');
    const err = document.getElementById('err');
    function errorMessage(msg) { err.style.display='block'; err.textContent=msg; }
    document.querySelector('a-scene').addEventListener('loaded', () => {
      status.textContent='Camera sẵn sàng. Hướng vào ảnh nền nông trại trên thiệp.';
      const renderer=document.querySelector('a-scene').renderer;
      if (renderer) renderer.setClearColor(0x000000,0);
    });
    target.addEventListener('targetFound', () => {
      status.textContent='ĐÃ NHẬN DIỆN: Nếu không thấy khung Bimbosan và sản phẩm, hãy chụp màn hình gửi mình.';
    });
    target.addEventListener('targetLost', () => {
      status.textContent='Mất nhận diện. Đưa camera hướng lại vào mặt thiệp nông trại.';
    });
    document.querySelectorAll('a-assets img').forEach(img => {
      img.addEventListener('error', () => errorMessage('Không tải được ảnh: '+img.getAttribute('src')));
    });
    window.addEventListener('error', e => errorMessage('Lỗi JavaScript: '+e.message));
  </script>
</body>
</html>
